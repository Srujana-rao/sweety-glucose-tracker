    <rect x="260" y="622" width="190" height="44" rx="12" fill="#fff"/>
    <rect x="279" y="629" width="30" height="30" rx="5" fill="#292b37"/>
    <rect x="291" y="635" width="5" height="18" fill="#f2d879"/>
    <path d="M450 636h24v16h-24z" fill="#e4dcff"/>
  </g>
  <g filter="url(#shadow)" transform="rotate(13 519 690)">
    <rect x="468" y="664" width="158" height="40" rx="11" fill="#fff"/>
    <rect x="485" y="670" width="26" height="28" rx="5" fill="#292b37"/>
    <rect x="495" y="675" width="5" height="18" fill="#f2d879"/>
    <path d="M626 677h20v14h-20z" fill="#e4dcff"/>
